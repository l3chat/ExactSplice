<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Hide</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#111827;color:#e5e7eb;margin:0}main{max-width:950px;margin:auto;padding:16px}section{background:#1f2937;border-radius:12px;padding:14px;margin:12px 0}h1{margin:0}h2{font-size:18px;margin:0 0 12px}button,input,select{font:inherit;padding:10px;border-radius:7px;border:1px solid #64748b;background:#111827;color:#fff}button{cursor:pointer}button.primary{background:#2563eb;border:0}button:disabled{opacity:.45}input[type=range]{width:100%;padding:0}input[type=text]{width:100%}video{width:100%;max-height:55vh;background:black;display:block}.player{position:relative}.mask{position:absolute;inset:0;background:#d9d9d9;color:#333;display:grid;place-content:center;text-align:center;pointer-events:none;font-size:clamp(24px,7vw,64px);font-variant-numeric:tabular-nums}.mask small{font-size:14px}.mask[hidden]{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.files{max-height:230px;overflow:auto}.files button{display:block;width:100%;text-align:left;margin:4px 0;overflow-wrap:anywhere}.muted{color:#aab6c8;font-size:13px}canvas{width:100%;height:46px;touch-action:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}label{display:block;margin:9px 0}#msg{color:#fbbf24}input[type=checkbox]{accent-color:#60a5fa}a{color:#93c5fd}</style><main><h1>Video Hide 0.3</h1><p class="muted">Локальное скрытие фрагментов видео · FFmpeg</p><section><h2>1. Исходный файл</h2><div class="row"><button id="up">↑ Папка выше</button><span id="dir"></span></div><div id="files" class="files"></div><p id="chosen"></p></section><section><h2>2. Выбор интервала</h2><div class="player"><video id="v" controls playsinline preload="metadata"></video><div id="mask" class="mask" hidden><span id="count"></span></div></div><input id="seek" type="range" min="0" max="1" step="0.001" value="0"><div class="row"><span id="clock">00:00:00</span><button id="back">−1 с</button><button id="forward">+1 с</button><button id="prev">‹ Ключевой</button><button id="next">Ключевой ›</button></div><canvas id="timeline" width="900" height="46"></canvas><p class="muted">Синие метки — ключевые кадры; красный — выбранный интервал; серый — расширение.</p><div class="row"><button id="zoomout">− Масштаб</button><button id="zoomin">+ Масштаб</button><button id="frameback">− кадр</button><button id="frameforward">+ кадр</button></div><input id="pan" type="range" min="0" max="1000" value="0"><button id="scan">Найти ключевые кадры</button> <span id="keyinfo" class="muted"></span><div class="row"><div><label for="a">Начало (ч:м:с)</label><input id="a" type="text" value="00:00:00"><button id="markA">← Текущий кадр</button></div><div><label for="b">Конец (ч:м:с)</label><input id="b" type="text" value="00:00:00"><button id="markB">← Текущий кадр</button></div></div><div class="row"><button id="add">Добавить интервал</button><button id="save">Сохранить проект</button><button id="load">Открыть проект</button><input id="project" type="file" accept=".json" hidden></div><div id="intervals"></div><label><input id="preview" type="checkbox"> Предпросмотр серого экрана</label><div id="expanded" class="muted"></div></section><section><h2>3. Экспорт</h2><label>Режим <select id="mode"><option value="exact">Smart Exact (экспериментальный)</option><option value="smart">Smart (расширение до ключевых кадров)</option><option value="full">Full (полное перекодирование)</option></select></label><label><input id="verify" type="checkbox"> Полная покадровая проверка (медленно)</label><label><input id="mute" type="checkbox" checked> Заглушить звук в скрытом интервале</label><div class="row"><label>Фон <input id="color" type="color" value="#d9d9d9"></label><label>Таймер <input id="fg" type="color" value="#333333"></label><label>Размер (% высоты) <input id="size" type="number" min="2" max="30" value="11"></label></div><p id="estimate" class="muted"></p><label>CRF (18 — высокое качество) <input id="crf" type="number" min="0" max="51" value="18"></label><label>Имя выходного файла относительно корневой папки<input id="output" type="text"></label><button id="start" class="primary">Создать видео</button><button id="cancel" disabled>Остановить</button><progress id="progress" max="100" value="0" style="width:100%"></progress><p id="msg" role="status"></p><p id="stats" class="muted"></p><progress id="stageprogress" max="100" value="0" style="width:100%"></progress><details id="logdetails"><summary>Журнал FFmpeg</summary><button type="button" id="copylog">Скопировать журнал</button><pre id="log"></pre></details></section></main><script>
const $=id=>document.getElementById(id), token='__TOKEN__',v=$('v');let file='',folder='',parent=null,keys=[],generation=0,busy=false, intervals=[], zoom=1, info=null, editing=-1;
async function api(route,q={}){let r=await fetch(route+'?'+new URLSearchParams({...q,token}));let d=await r.json();if(!r.ok)throw Error(d.error);return d}
const error=e=>$('msg').textContent=e.message||e;
function fmt(t,ms=false){t=Math.max(0,t||0);let n=Math.floor(t),p=x=>String(x).padStart(2,'0');return p(Math.floor(n/3600))+':'+p(Math.floor(n/60)%60)+':'+p(n%60)+(ms?'.'+String(Math.floor((t-n)*1000+1e-6)).padStart(3,'0'):'')}
function sec(s){let p=s.trim().split(':').map(Number);return p.length<=3&&p.every(x=>Number.isFinite(x)&&x>=0)&&s.trim()?p.reduce((a,b)=>a*60+b,0):NaN}
async function list(dir=''){try{let d=await api('/list',{dir});folder=dir;parent=d.parent;$('dir').textContent=dir||'/';$('up').disabled=parent===null;$('files').replaceChildren();for(let x of d.items){let b=document.createElement('button');b.textContent=(x.dir?'📁 ':'▶ ')+x.name;b.onclick=()=>x.dir?list(x.path):choose(x.path);$('files').append(b)}}catch(e){error(e)}}
function choose(f){generation++;file=f;keys=[];intervals=[];editing=-1;zoom=1;info=null;$('pan').value=0;$('add').textContent='Добавить интервал';api('/info',{file:f}).then(d=>{if(file===f){info=d;draw()}}).catch(error);render();$('chosen').textContent=f;$('keyinfo').textContent='';$('a').value=$('b').value='00:00:00';$('output').value=f.replace(/\.[^.]+$/,'')+'_hidden.mp4';v.src='/video?'+new URLSearchParams({file:f,token});draw()}
function merged(rs){let out=[];for(let [a,b] of rs.slice().sort((x,y)=>x[0]-y[0])){if(out.length&&a<=out.at(-1)[1])out.at(-1)[1]=Math.max(b,out.at(-1)[1]);else out.push([a,b])}return out}
function ranges(){let rs=intervals.slice();let a=sec($('a').value),b=sec($('b').value);if(b>a){if(editing>=0)rs[editing]=[a,b];else rs.push([a,b])}return merged(rs)}
function expanded(){return merged(ranges().map(([a,b])=>{$('mode').value==='smart'&&keys.length&&(a=keys.filter(k=>k<=a).at(-1)??a,b=keys.find(k=>k>=b)??b);return [a,b]}))}
function windowRange(){let d=info?.duration||v.duration||1,w=d/zoom;return [(d-w)*+$('pan').value/1000,w]}
function render(){$('intervals').replaceChildren();intervals.forEach(([a,b],i)=>{let r=document.createElement('div');r.className='row';let label=document.createElement('span');label.textContent=fmt(a,true)+' — '+fmt(b,true);let edit=document.createElement('button');edit.textContent='Изменить';edit.onclick=()=>{editing=i;$('a').value=fmt(a,true);$('b').value=fmt(b,true);$('add').textContent='Обновить интервал';draw()};let del=document.createElement('button');del.textContent='Удалить';del.onclick=()=>{intervals.splice(i,1);resetDraft();render();draw()};r.append(label,edit,del);$('intervals').append(r)})}
function resetDraft(){editing=-1;$('a').value=$('b').value='00:00:00';$('add').textContent='Добавить интервал'}
$('add').onclick=()=>{let a=sec($('a').value),b=sec($('b').value);if(!(a>=0&&b>a&&b<=(info?.duration||v.duration)))return error('Неверный интервал');if(editing>=0)intervals[editing]=[a,b];else intervals.push([a,b]);resetDraft();render();draw()};
function draw(){let d=info?.duration||v.duration,c=$('timeline'),ctx=c.getContext('2d'),w=c.width;ctx.clearRect(0,0,w,46);ctx.fillStyle='#374151';ctx.fillRect(0,8,w,30);if(!Number.isFinite(d)||d<=0)return;let [start,span]=windowRange(),x=t=>(t-start)/span*w;let rs=expanded();for(let [a,b] of rs){ctx.fillStyle=$('color').value;ctx.fillRect(x(a),8,x(b)-x(a),30)}for(let [a,b] of ranges()){ctx.fillStyle='#b45353';ctx.fillRect(x(a),12,x(b)-x(a),22)}ctx.fillStyle='#60a5fa';for(let k of keys)if(k>=start&&k<=start+span)ctx.fillRect(x(k),4,1,38);ctx.fillStyle='white';ctx.fillRect(x(v.currentTime),0,2,46);$('expanded').textContent='Интервалы: '+rs.map(([a,b])=>fmt(a,true)+' — '+fmt(b,true)).join('; ')+' | шкала '+fmt(start)+' — '+fmt(start+span);let r=rs.find(([a,b])=>v.currentTime>=a&&v.currentTime<b),show=$('preview').checked&&!!r;$('mask').hidden=!show;$('mask').style.background=$('color').value;$('mask').style.color=$('fg').value;$('count').style.fontSize=(v.clientHeight*+$('size').value/100)+'px';$('count').textContent=r?fmt(Math.ceil(r[1]-v.currentTime)):'';v.muted=show&&$('mute').checked;let hidden=rs.reduce((s,[a,b])=>s+b-a,0);$('estimate').textContent=info?'Исходный размер: '+(info.size/1048576).toFixed(1)+' МиБ. '+($('mode').value!=='full'?'Грубая оценка сохранённых данных по доле времени: '+(info.size*(1-hidden/d)/1048576).toFixed(1)+' МиБ (без учёта звука и новых кадров).':'Размер при CRF заранее неизвестен.'):''}
function step(n){let f=info?.fps?.split('/').map(Number)||[25,1];v.pause();v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+n*f[1]/f[0]))}
$('frameback').onclick=()=>step(-1);$('frameforward').onclick=()=>step(1);$('pan').oninput=draw;function scale(n){zoom=Math.max(1,Math.min(1024,zoom*n));let d=info?.duration||v.duration||1;let w=d/zoom;$('pan').value=zoom===1?0:Math.max(0,Math.min(1000,(v.currentTime-w/2)/(d-w)*1000));draw()};$('zoomin').onclick=()=>scale(2);$('zoomout').onclick=()=>scale(.5);
function settings(){return {file,output:$('output').value,intervals:ranges(),smart:$('mode').value!=='full',mode:$('mode').value,verify:$('verify').checked,mute:$('mute').checked,crf:+$('crf').value,color:$('color').value,fg:$('fg').value,size:+$('size').value}}
$('save').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(settings(),null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='video-hide-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('load').onclick=()=>$('project').click();$('project').onchange=async()=>{try{let d=JSON.parse(await $('project').files[0].text());if(!d.file||!Array.isArray(d.intervals))throw Error('Неверный проект');choose(d.file);intervals=d.intervals;for(let id of ['output','crf','color','fg','size'])if(d[id]!==undefined)$(id).value=d[id];$('mode').value=d.mode||(d.smart?'smart':'full');$('verify').checked=!!d.verify;$('mute').checked=!!d.mute;render();draw()}catch(e){error(e)}finally{$('project').value=''}};
v.onloadedmetadata=()=>{$('seek').max=v.duration;draw()};v.ontimeupdate=()=>{$('seek').value=v.currentTime;$('clock').textContent=fmt(v.currentTime,true)+' / '+fmt(v.duration);draw()};v.onerror=()=>error('Браузер не поддерживает предпросмотр этого файла. Можно ввести время вручную.');$('seek').oninput=()=>v.currentTime=+$('seek').value;$('timeline').onclick=e=>{if(Number.isFinite(v.duration))v.currentTime=windowRange()[0]+(e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.clientWidth*windowRange()[1]};$('up').onclick=()=>list(parent);$('back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-1);$('forward').onclick=()=>v.currentTime=Math.min(v.duration,v.currentTime+1);$('prev').onclick=()=>{let k=keys.filter(k=>k<v.currentTime-.001).at(-1);if(k!==undefined)v.currentTime=k};$('next').onclick=()=>{let k=keys.find(k=>k>v.currentTime+.001);if(k!==undefined)v.currentTime=k};$('markA').onclick=()=>{$('a').value=fmt(v.currentTime,true);draw()};$('markB').onclick=()=>{$('b').value=fmt(v.currentTime,true);draw()};for(let id of ['a','b','mode','preview','mute','color','fg','size'])$(id).oninput=draw;
$('scan').onclick=async()=>{if(!file)return;let g=generation;$('scan').disabled=true;$('keyinfo').textContent='Сканирование…';try{let d=await api('/keys',{file});if(g===generation){keys=d.keys;$('keyinfo').textContent=keys.length+' ключевых кадров';draw()}}catch(e){error(e)}finally{$('scan').disabled=false}};
$('start').onclick=async()=>{let rs=ranges();if(!file||!rs.length||rs.some(([a,b])=>!(a>=0&&b>a&&b<=(info?.duration||v.duration)))){error('Проверьте интервал');return}if(!confirm('Создать новый файл? '+($('mute').checked?'Звук будет заглушён.':'ВНИМАНИЕ: оригинальный звук останется.')))return;try{let r=await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json','X-Token':token},body:JSON.stringify(settings())});let d=await r.json();if(!r.ok)throw Error(d.error);poll()}catch(e){error(e)}};
$('cancel').onclick=async()=>{try{await fetch('/cancel',{method:'POST',headers:{'X-Token':token}});$('cancel').disabled=true}catch(e){error(e)}};
async function poll(){try{let d=await api('/status'),active=['running','cancelling'].includes(d.state);$('start').disabled=active;$('cancel').disabled=d.state!=='running';$('log').textContent=d.log;if(d.state==='error'){ $('logdetails').open=true; $('log').scrollTop=$('log').scrollHeight; }$('progress').value=d.progress||0;$('stageprogress').value=d.stage_progress||0;$('msg').textContent=({running:d.stage||'Обработка…',cancelling:'Остановка…',cancelled:'Остановлено. Проект сохранён отдельно.',done:'Готово. Проверьте выходной файл.',error:'Ошибка: '+(String(d.log||'').trim().split('\n').filter(x=>x.startsWith('ERROR:')).pop()||'см. журнал'),idle:''})[d.state];$('stats').textContent=active||d.state==='done'?[`${(d.progress||0).toFixed(1)}%`, `Прошло ${fmt(d.elapsed)}`,d.progress>0&&d.progress<100?'Грубая оценка остатка '+fmt(d.elapsed*(100-d.progress)/d.progress):'',d.speed?'Скорость '+d.speed:'',d.bytes!=null?'Текущий этап: '+(d.bytes/1048576).toFixed(1)+' МиБ':''].filter(Boolean).join(' · '):'';if(active)setTimeout(poll,1000)}catch(e){error(e)}}$('copylog').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent)}catch(e){let r=document.createRange();r.selectNodeContents($('log'));let s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy')}};list();poll();
</script></html>
